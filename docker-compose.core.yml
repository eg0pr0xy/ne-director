services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ne_director
      POSTGRES_USER: ne_director
      POSTGRES_PASSWORD: ne_director_local_only
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["ne_director_postgres:/var/lib/postgresql/data"]
volumes:
  ne_director_postgres:
